# Round-robin load balancer in front of three TaskFlow containers (episode 5.3).
# Each instance has a fixed address on the demo network, so the response can say WHICH one answered.
events {}

http {
  # $upstream_addr is the address nginx really used. When it had to retry, it lists every address it
  # tried, so the pattern is anchored to the END: the last one is the instance that answered.
  map $upstream_addr $instance {
    ~10\.53\.0\.11:8080$  app1;
    ~10\.53\.0\.12:8080$  app2;
    ~10\.53\.0\.13:8080$  app3;
    default               none;
  }

  upstream taskflow {
    # No weight, no ip_hash: the default is round robin. Request 1 goes to the first server, request 2 to the second.
    server 10.53.0.11:8080;   # tf-app1
    server 10.53.0.12:8080;   # tf-app2
    server 10.53.0.13:8080;   # tf-app3
  }

  server {
    listen 80;
    proxy_connect_timeout 1s;                  # give up on a dead instance quickly, then try the next one
    add_header X-Served-By $instance always;   # which instance answered this request

    location / {
      proxy_pass http://taskflow;
    }
  }
}
